# /etc/katam/config.yaml  (Katam Virtualization 0.5)
# After editing: sudo systemctl restart katam

controller:
  listen: 0.0.0.0
  port: 8080
  public_url: https://katam.example.com          # what users type; SAML uses it for callbacks
  secret_key: REPLACE_WITH_openssl_rand_hex_32  # signs sessions; keep it secret
  novnc_url: https://katam.example.com:6080
  database_url: sqlite:////var/lib/katam/katam.db
  # Several controllers: run katam-cluster (etcd + Patroni); it fills in database_url and cluster.
  # database_url: postgresql://katam:PASSWORD@172.20.10.20/katam
  bootstrap_admin: {user: admin, password: CHANGE-ME-on-first-login}

auth:
  local: true
  ldap:                                       # Active Directory sign-in with username + password
    enabled: false
    url: ldaps://dc1.corp.local
    bind_dn: CN=svc-katam,OU=Service Accounts,DC=corp,DC=local
    bind_password: ""
    base_dn: DC=corp,DC=local
    user_filter: "(&(objectClass=user)(sAMAccountName={username}))"
    ca_file: /etc/katam/ad-ca.pem
  saml:                                       # single sign-on: Entra ID, ADFS, Okta, Keycloak
    enabled: false
    button_label: Sign in with Microsoft
    idp_entity_id: https://sts.windows.net/<tenant-id>/
    idp_sso_url: https://login.microsoftonline.com/<tenant-id>/saml2
    idp_x509cert: "<base64 signing certificate from the IdP>"
    groups_attribute: http://schemas.microsoft.com/ws/2008/06/identity/claims/groups
# Grant roles to directory groups in the UI (Access > Role bindings), e.g.
#   group:Katam-Admins -> admin on *     group:Platform-Team -> operator on k8s-lab
# With Entra ID, groups arrive as object IDs: bind group:<object-id>.

nodes:                                        # any x86-64 servers running Ubuntu 24.04
  - name: hv1
    host: 172.20.10.11
    uri: qemu+ssh://katam@172.20.10.11/system?keyfile=/var/lib/katam/.ssh/id_ed25519
    migration_address: 172.20.30.11
    site: primary
    bmc: {address: 172.20.99.11, user: katam-fence, password: "", verify_tls: false}   # Redfish: iBMC, iDRAC, iLO, XCC, Supermicro
  - name: hv2
    host: 172.20.10.12
    uri: qemu+ssh://katam@172.20.10.12/system?keyfile=/var/lib/katam/.ssh/id_ed25519
    migration_address: 172.20.30.12
    site: primary
    bmc: {address: 172.20.99.12, user: katam-fence, password: ""}
  - name: hv3
    host: 172.20.10.13
    uri: qemu+ssh://katam@172.20.10.13/system?keyfile=/var/lib/katam/.ssh/id_ed25519
    migration_address: 172.20.30.13
    site: primary
    bmc: {address: 172.20.99.13, user: katam-fence, password: ""}
  - name: hv4
    host: 172.20.10.14
    uri: qemu+ssh://katam@172.20.10.14/system?keyfile=/var/lib/katam/.ssh/id_ed25519
    migration_address: 172.20.30.14
    site: primary
    bmc: {address: 172.20.99.14, user: katam-fence, password: ""}

storage:
  type: rbd                     # rbd (Ceph, needed for HA and live migration) or dir (local disks)
  pool: vmpool                  # libvirt pool name on every node
  import_node: hv1              # where image conversions run
  virtio_win_iso: virtio-win.iso
  rbd:
    ceph_pool: vms
    user: libvirt
    secret_uuid: 00000000-0000-0000-0000-000000000000
    monitors: [172.20.30.11, 172.20.30.12, 172.20.30.13]
    fsid: ""                                   # printed by ceph-bootstrap.sh
    csi: {user: kubernetes, key: "", pool: kubernetes}
  # dir mode instead:
  # type: dir
  # dir_path: /var/lib/katam/images

sdn:
  enabled: false                # true after ovn-central.sh and prepare-node.sh --sdn
  central_node: hv1
  provider_network: provider    # matches ovn-bridge-mappings on the nodes
  routers: []
  # routers:
  #   - name: lab
  #     networks: [app-tier, db-tier]
  #     external: {network: dmz, ip_cidr: 172.20.60.10/24, next_hop: 172.20.60.1, gateway_chassis: [hv1, hv2]}

networks:
  # Plain Linux bridges (no SDN needed, no micro-segmentation)
  - {name: mgmt, label: "Management (VLAN 10)", type: bridge, bridge: br10}
  - {name: k8s, label: "Kubernetes (VLAN 20)", type: bridge, bridge: br20, gateway: 172.20.20.1, dns: [172.20.20.1]}
  - {name: windows, label: "Windows (VLAN 40)", type: bridge, bridge: br40}
  # SDN networks (micro-segmented with security groups)
  # - {name: prod-vlan20, label: "Production (VLAN 20, SDN)", type: ovn-vlan, vlan: 20}
  # - {name: app-tier, label: "App tier (overlay)", type: ovn-overlay, cidr: 172.16.10.0/24, gateway: 172.16.10.1, dhcp: true, dns: [172.20.10.1]}

scheduler: {host_reserve_mb: 24576, memory_overcommit: 1.0}
limits: {max_vcpus: 32, max_memory_gb: 160, max_disk_gb: 4096}
cloud_init:
  default_user: lab
  ssh_keys: ["ssh-ed25519 AAAA... you@laptop"]

finops:
  currency: USD                 # any ISO code; set the rates in that currency
  sample_interval_s: 300
  rates: {vcpu_hour: 1.5, ram_gb_hour: 0.8, disk_gb_month: 6.0, gpu_hour: 60.0, kwh: 28.0}

ha:
  enabled: true
  interval_s: 10
  failures_before_fence: 3      # about 30 s of silence before fencing starts
  witness_url: http://172.20.50.5:8443
  witness_token: REPLACE_WITH_RANDOM

protection:
  scheduler_interval_s: 300     # how often snapshot schedules are checked
  max_lock_days: 3650
  vault:                        # immutable copies: S3 bucket with Object Lock (COMPLIANCE mode)
    enabled: false
    endpoint: https://s3.example.com   # MinIO, Ceph RGW, Wasabi, AWS S3...; omit for AWS
    region: us-east-1
    bucket: katam-vault                # must be created with Object Lock enabled
    access_key: ""
    secret_key: ""
    prefix: katam/
    retention_days: 30
    # Keep this bucket outside the cluster's admin domain (separate box, separate credentials).

updates:
  feed_url: null                # e.g. https://RaymondKatam.github.io/katam/releases.json
  channel: stable

dr:
  sites:
    dr:
      mode: rbd-mirror          # or stretch
      ceph_node: dr1            # a DR-site node that can run rbd commands
      snapshot_interval: 5m
      storage:
        rbd: {monitors: [10.1.30.11, 10.1.30.12, 10.1.30.13], secret_uuid: 11111111-1111-1111-1111-111111111111}
# DR-site nodes go under nodes: with site: dr
  # PR/DR watch (set on the DR site's controllers): fail over only when this site AND the witness
  # both can't reach the primary. approve: true waits for an admin to click Approve failover.
  watch:
    enabled: false
    plan: core-services          # DR plan to run in disaster mode
    primary_host: 172.20.10.5    # the primary site's controller address (its virtual IP)
    primary_port: 8080
    witness_url: http://172.20.50.5:8443
    witness_token: REPLACE_WITH_RANDOM
    after_s: 120                 # how long the primary must be down before acting
    approve: true

# Where the control plane runs. single (default): one controller. etcd: a controller on every
# node; they elect a leader through etcd and share a Patroni-replicated PostgreSQL.
# katam-cluster join writes this section for you.
cluster:
  mode: single
  # member: hv1
  # advertise_url: http://172.20.10.11:8080
  # etcd:
  #   endpoints: [https://172.20.10.11:2379, https://172.20.10.12:2379, https://172.20.10.13:2379]
  #   lease_ttl_s: 10            # a new leader takes over about 10-20 s after the old one dies
  #   ca: /etc/katam/etcd/ca.crt
  #   cert: /etc/katam/etcd/member.crt
  #   key: /etc/katam/etcd/member.key
  # vip: {address: 172.20.10.5/24, interface: br-mgmt}   # follows the leader; users browse here

# Prometheus scrapes /metrics; the Grafana dashboard is in /usr/share/katam/integrations/grafana.
metrics:
  enabled: true
  token: null                    # set one (openssl rand -hex 24) and give it to Prometheus
  allow: [127.0.0.1/32]          # addresses that may scrape without the token

# Optional: send events (failover, leader change, upgrades, runbook runs) to Grafana as annotations.
grafana:
  url: null                      # e.g. https://grafana.example.com
  token: null                    # Grafana service account token with the Annotations:write permission
  dashboard_uid: katam-overview

# Runbooks kept in Git (GitOps). See /usr/share/katam/examples/gitops/README.md.
runbooks:
  git:
    url: null                    # e.g. git@github.com:your-org/katam-runbooks.git
    branch: main
    path: runbooks
    interval_s: 300
    webhook_secret: null         # webhook: POST https://<katam>/api/v1/hooks/git
    ssh_key: null                # read-only deploy key, e.g. /var/lib/katam/.ssh/runbooks_deploy
    prune: true
